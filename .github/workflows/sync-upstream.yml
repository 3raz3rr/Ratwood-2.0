# Daily fork sync from Rotwood-Vale/Ratwood-2.0 into this repo's main.
# After the first push: enable Actions on the fork, then run this workflow once by hand.
name: Sync upstream

on:
  schedule:
    - cron: "0 4 * * *" # 07:00 MSK
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge Rotwood-Vale/main
    runs-on: ubuntu-24.04
    steps:
      - name: Sync fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main 2>&1)"
          status=$?
          echo "$out"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$out" | grep -qiE 'already up.to.date|not out of date|Nothing to sync'; then
            echo "Already up to date."
            exit 0
          fi
          echo "::error::Upstream sync failed. On a conflict, merge Rotwood-Vale/main into this fork locally."
          exit "$status"
